name: Fusion case-package conformance

on:
  pull_request:
    paths:
      - "schemas/fusion-qualification-case.schema.json"
      - "benchmarks/conformance/**"
      - "scripts/validate_fusion_cases.py"
      - "src/case_package.rs"
      - "src/bin/validate_case_package.rs"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fusion-case-package.yml"
  push:
    branches:
      - main
      - research/fusion-qualification-case-package-v0
    paths:
      - "schemas/fusion-qualification-case.schema.json"
      - "benchmarks/conformance/**"
      - "scripts/validate_fusion_cases.py"
      - ".github/workflows/fusion-case-package.yml"

permissions:
  contents: read

jobs:
  schema-and-semantic-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
      - name: Set up Python for the development-only JSON Schema validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned schema-validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema[format]==4.26.0
      - name: Validate schema, fixtures, references, evidence digests and negative controls
        run: python scripts/validate_fusion_cases.py
      - name: Set up Rust for the runtime semantic validator
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust semantic validator on every case package
        shell: bash
        run: |
          shopt -s nullglob
          cases=(benchmarks/conformance/*.case.json)
          if [ ${#cases[@]} -eq 0 ]; then
            echo "No case package fixtures found" >&2
            exit 1
          fi
          for case in "${cases[@]}"; do
            cargo run --quiet --bin spark-case-validate -- "$case"
          done
